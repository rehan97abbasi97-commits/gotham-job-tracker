<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-labelledby="title desc">
  <title id="title">GOTHAM logo</title>
  <desc id="desc">An original Gotham-inspired city crest in gold and graphite, with the word GOTHAM and the tagline Your Career. Your Next Move.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE995"/>
      <stop offset=".48" stop-color="#F2C94C"/>
      <stop offset="1" stop-color="#B98219"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C2733"/>
      <stop offset="1" stop-color="#080D12"/>
    </linearGradient>
  </defs>
  <!-- Standalone transparent logo; background is intentionally omitted. -->
  <g transform="translate(22 20)">
    <path d="M28 48 L67 61 L84 32 L112 52 L140 32 L157 61 L196 48 L184 117 L160 145 L112 163 L64 145 L40 117 Z"
          fill="url(#panel)" stroke="url(#gold)" stroke-width="4" stroke-linejoin="round"/>
    <!-- Original city skyline emblem -->
    <circle cx="112" cy="88" r="48" fill="url(#gold)" opacity=".16"/>
    <path d="M52 116 V91 H66 V72 H74 V97 H88 V80 H98 V58 H107 V44 H116 V66 H127 V86 H139 V74 H149 V96 H165 V83 H174 V116 Z" fill="url(#gold)"/>
    <path d="M42 116 H182 L157 136 L112 151 L67 136 Z" fill="#0B1118" stroke="#394451" stroke-width="1.5"/>
    <path d="M75 126 L94 126 L94 115 L106 115 L106 126 L118 126 L118 113 L130 113 L130 126 L149 126" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g text-anchor="middle">
    <text x="420" y="111" fill="url(#gold)" font-family="Georgia, 'Times New Roman', serif" font-size="56" letter-spacing="9">GOTHAM</text>
    <path d="M287 132 H553" stroke="#46515E" stroke-width="1"/>
    <path d="M405 132 H435" stroke="url(#gold)" stroke-width="2.5"/>
    <text x="420" y="159" fill="#AAB5C2" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="3.1">YOUR CAREER. YOUR NEXT MOVE.</text>
  </g>
</svg>
